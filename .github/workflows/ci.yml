name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # pushing a version tag (e.g. v0.2.0) also publishes a release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ebitengine builds without a C toolchain (it loads OpenGL/X11 at runtime),
  # so no system packages are needed. This matches local development.
  CGO_ENABLED: "0"

jobs:
  check:
    name: Lint, test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # honors the pinned toolchain line

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet (Linux + Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Staticcheck (Linux + Windows)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
          GOOS=windows staticcheck ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=windows govulncheck ./...

      - name: Windows icon/version resources are up to date
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          go run ./tools/mkicon -out build/windows
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --in build/windows/winres.json --out rsrc --arch amd64 \
            --file-version "$V.0" --product-version "$V.0"
          if ! git diff --exit-code --stat -- rsrc_windows_amd64.syso build/windows; then
            echo "Regenerate with scripts/build-installer.sh and commit the result."; exit 1
          fi

  installer:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Inno Setup (if the runner lacks it)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1" # keep ISCC's /Q-style switches intact
        run: scripts/build-installer.sh

      - uses: actions/upload-artifact@v7
        with:
          name: retro-shooter-installer
          path: dist/RetroShooter-Setup-*.exe
          retention-days: 14

  build:
    name: Build ${{ matrix.goos }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            out: shooter.exe
          - goos: linux
            out: shooter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.out }} .

      - uses: actions/upload-artifact@v7
        with:
          name: retro-shooter-${{ matrix.goos }}
          path: ${{ matrix.out }}
          retention-days: 14

  # Runs only for version tags. Publishes a GitHub Release with the installer
  # under two names: versioned, and a stable "RetroShooter-Setup.exe" so
  # .../releases/latest/download/RetroShooter-Setup.exe always works.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches VERSION file
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION ($v)."; exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir out
          cp "artifacts/retro-shooter-installer/RetroShooter-Setup-$v.exe" out/
          cp "out/RetroShooter-Setup-$v.exe" out/RetroShooter-Setup.exe
          cp artifacts/retro-shooter-linux/shooter "out/retro-shooter-$v-linux-amd64"
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Retro Shooter $v" --generate-notes --verify-tag
