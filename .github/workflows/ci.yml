name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ebitengine builds without a C toolchain (it loads OpenGL/X11 at runtime),
  # so no system packages are needed. This matches local development.
  CGO_ENABLED: "0"

jobs:
  check:
    name: Lint, test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # honors the pinned toolchain line

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet (Linux + Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Staticcheck (Linux + Windows)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
          GOOS=windows staticcheck ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=windows govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            out: shooter.exe
          - goos: linux
            out: shooter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.out }} .

      - uses: actions/upload-artifact@v7
        with:
          name: retro-shooter-${{ matrix.goos }}
          path: ${{ matrix.out }}
          retention-days: 14
